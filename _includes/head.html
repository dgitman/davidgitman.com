<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  {% seo %}
  <meta property="og:image:alt" content="David Gitman — Technology Leader in eCommerce, Cloud &amp; AI">
  <meta name="twitter:image:alt" content="David Gitman — Technology Leader in eCommerce, Cloud &amp; AI">

  <link rel="alternate" type="text/plain" href="{{ '/llms.txt' | absolute_url }}" title="LLM context">
  <link rel="alternate" type="text/plain" href="{{ '/llms-full.txt' | absolute_url }}" title="Full LLM context">

  {% include rel-me-links.html %}
  {% include google-analytics.html %}

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Google font typography settings - defined in _config.yml -->
  {% if site.resume_theme == 'default' %}
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;700&amp;family=Open+Sans:wght@300;400;700;800&amp;display=swap" rel="stylesheet">
  {% endif %}

  <link rel="stylesheet" href="{{ '/css/main.css' | relative_url }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/favicon.png' | relative_url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/apple-touch-icon.png' | relative_url }}">
  {% if page.url == '/' %}
    {% include json-ld-resume.html %}
  {% else %}
    {% include json-ld-content.html %}
  {% endif %}
</head>
