{% assign page_url = page.url | absolute_url %}
{% assign modified_date = page.last_modified_at | default: site.last_modified_at %}
{% assign schema_type = page.schema_type | default: 'WebPage' %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": {{ schema_type | jsonify }},
      "@id": {{ page_url | append: '#webpage' | jsonify }},
      "url": {{ page_url | jsonify }},
      "name": {{ page.title | jsonify }},
      "description": {{ page.description | jsonify }},
      "inLanguage": "en-US"{% if page.date_published %},
      "datePublished": {{ page.date_published | jsonify }}{% endif %},
      "dateModified": {{ modified_date | jsonify }},
      "isPartOf": {
        "@type": "WebSite",
        "@id": {{ site.url | append: '/#website' | jsonify }},
        "url": {{ site.url | append: '/' | jsonify }},
        "name": {{ site.title | jsonify }}
      },
      "author": {
        "@type": "Person",
        "@id": {{ site.url | append: '/#person' | jsonify }},
        "name": {{ site.resume_name | jsonify }},
        "url": {{ site.url | append: '/' | jsonify }}
      },
      "breadcrumb": {
        "@id": {{ page_url | append: '#breadcrumb' | jsonify }}
      }{% if page.schema_about and page.schema_about.size > 0 %},
      "about": [
        {%- for topic in page.schema_about -%}
        { "@type": "Thing", "name": {{ topic | jsonify }} }{% unless forloop.last %},{% endunless %}
        {%- endfor -%}
      ]{% endif %}
    },
    {
      "@type": "BreadcrumbList",
      "@id": {{ page_url | append: '#breadcrumb' | jsonify }},
      "itemListElement": [
        {
          "@type": "ListItem",
          "position": 1,
          "name": "Home",
          "item": {{ site.url | append: '/' | jsonify }}
        }{% if page.breadcrumb_parent and page.breadcrumb_parent_url %},
        {
          "@type": "ListItem",
          "position": 2,
          "name": {{ page.breadcrumb_parent | jsonify }},
          "item": {{ page.breadcrumb_parent_url | absolute_url | jsonify }}
        },
        {
          "@type": "ListItem",
          "position": 3,
          "name": {{ page.title | jsonify }},
          "item": {{ page_url | jsonify }}
        }{% else %},
        {
          "@type": "ListItem",
          "position": 2,
          "name": {{ page.title | jsonify }},
          "item": {{ page_url | jsonify }}
        }{% endif %}
      ]
    }
  ]
}
</script>
